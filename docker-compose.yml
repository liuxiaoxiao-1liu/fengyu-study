name: fengyu

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./dist/client:/usr/share/nginx/html:ro
      - ./deploy/nginx.container.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      # 部署用运行时镜像：本地已经构建好 dist/
      dockerfile: docker/app.runtime.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      GUESTBOOK_DB: /data/guestbook.sqlite
      # 内容后台的数据与上传文件；和留言库共用 /data 卷
      CONTENT_DB: /data/content.sqlite
      CONTENT_UPLOADS: /data/uploads
      # 管理后台登录：用户名 + scrypt 密码哈希 + 会话签名密钥，只写在服务器 .env
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # 旧管理令牌：保留给 /admin/letters/ 与 Bearer API 兼容
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 酷狗账号登录态：只用于把站内白名单曲目换成播放直链，不进仓库
      KUGOU_TOKEN: ${KUGOU_TOKEN:-}
      KUGOU_USERID: ${KUGOU_USERID:-}
      KUGOU_VIP_TOKEN: ${KUGOU_VIP_TOKEN:-}
      KUGOU_VIP_TYPE: ${KUGOU_VIP_TYPE:-}
      KUGOU_MID: ${KUGOU_MID:-}
      KUGOU_GUID: ${KUGOU_GUID:-}
      KUGOU_DFID: ${KUGOU_DFID:-}
    volumes:
      - guestbook-data:/data
    expose:
      - '4321'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  guestbook-data:
