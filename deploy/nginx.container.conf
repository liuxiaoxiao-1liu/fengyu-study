limit_req_zone $binary_remote_addr zone=guestbook_api:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Docker 里把日志交给 docker logs
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # 构建产物带内容哈希，可以长期缓存
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # 留言 API 交给 Astro Node 服务
    location = /api/guestbook {
        limit_req zone=guestbook_api burst=2 nodelay;
        limit_req_status 429;

        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        proxy_pass http://app:4321;
    }

    # 不对外提供 .git / .env 之类的隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
