name: fengyu

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./dist/client:/usr/share/nginx/html:ro
      - ./deploy/nginx.container.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      # 部署用运行时镜像：本地已经构建好 dist/
      dockerfile: docker/app.runtime.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      GUESTBOOK_DB: /data/guestbook.sqlite
      # 管理后台令牌：写在服务器 /opt/fengyu/.env，不进仓库；未设置时 /api/admin/* 返回 503
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - guestbook-data:/data
    expose:
      - "4321"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  guestbook-data:
