name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format + check + build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ASTRO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
