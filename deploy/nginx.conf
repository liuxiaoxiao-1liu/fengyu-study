server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name example.com _;
    root /var/www/xiaoquanzi;
    index index.html;

    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/xiaoquanzi.access.log;
    error_log /var/log/nginx/xiaoquanzi.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # 构建产物带内容哈希，可以长期缓存
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }


    # 留言信箱：交给 php-fpm 处理，数据在 /var/lib/xiaoquanzi
    location = /api/guestbook {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/xiaoquanzi-api/guestbook.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        client_max_body_size 16k;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
